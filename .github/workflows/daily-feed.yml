name: daily-feed

# Recomputes wallet grades, then walks every tracked bet to settlement and
# archives the digest. Each run leaves feed/YYYY-MM-DD.md plus feed/latest.md,
# so the record of what was said — and when — is auditable after the fact.

on:
  schedule:
    - cron: '41 22 * * *'   # 07:41 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 12 minutes stopped being enough on 2026-09-14, the day the Postgres
    # replica memory limit went 32GB -> 5GB. With a 32GB page cache the regrade
    # finished inside the window; without it, it does not. Every run from 9/15
    # to 9/23 was cancelled at 738-768s — nine in a row, each still writing
    # gigabytes of temp files before it died, and none of it visible anywhere.
    #
    # Measured end to end on 2026-09-23: regrade 1197s + settlement feed 1112s
    # = 2327s. The first attempt at this fix used 40, which came from timing
    # the regrade alone and forgetting that settlement-feed.mjs takes about as
    # long again — it passed with 73 seconds to spare, which is not a margin.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev

      - name: Recompute wallet grades
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node wallet-grades.mjs

      - name: Build settlement feed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: '1'
        run: node settlement-feed.mjs

      - name: Archive digest
        run: |
          set -e
          DATE=$(date -u +%F)
          mkdir -p feed
          cp feed.md "feed/${DATE}.md"
          cp feed.md feed/latest.md
          cp feed.json "feed/${DATE}.json"
          git config user.name  "ozscan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f feed/
          git diff --staged --quiet || git commit -m "feed: ${DATE} settlement digest"
          # This job holds a checkout for ~40 minutes, so any push landing on
          # main meanwhile makes a bare push fail and throws the digest away
          # (2026-09-23). Rebase once and retry rather than lose it.
          git push || { git pull --rebase && git push; }
