name: expand-universe

# Grades ~1,200 wallets instead of the stale April 64. Progress lives in the
# grade_universe table, so these 45-minute runs converge on completion and
# no-op once done. Free on a public repo. DELETE the schedule after the
# universe completes.

on:
  schedule:
    - cron: '23 * * * *'   # hourly; 45-min runs cannot overlap on time alone,
                           # but GitHub fires ticks late, so guard with concurrency
  workflow_dispatch:

concurrency:
  group: expand-universe
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Expand grading universe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIME_BUDGET_MIN: '40'
        run: |
          set -o pipefail
          node expand-universe.mjs | tee expand.log
      # Once the universe is complete this fires every run, which is deliberate:
      # grades keep refreshing as outcome labels land, until the schedule is removed.
      - name: Regrade on completion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if grep -q "UNIVERSE COMPLETE" expand.log; then
            node wallet-grades.mjs
          else
            echo "universe not complete yet — skipping regrade"
          fi
      # One-time completion notice: creating an issue triggers GitHub's email
      # notification to the repo owner. Skipped once the marker issue exists.
      - name: Notify on first completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "UNIVERSE COMPLETE" expand.log 2>/dev/null; then
            if [ "$(gh issue list --repo ${{ github.repository }} --state all --search 'Universe backfill complete in:title' --json number --jq 'length')" = "0" ]; then
              gh issue create --repo ${{ github.repository }} \
                --title "Universe backfill complete — regrade is live" \
                --body "expand-universe drained the backfill queue and wallet-grades has run. Grades now refresh hourly as settlement labels land. Next: check label coverage, rebuild the report, then remove this workflow's schedule."
            else
              echo "completion issue already exists — skipping"
            fi
          fi
