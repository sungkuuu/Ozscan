name: backfill-gap

# Manual one-off: run the 4/19–8/19 gap backfill from a GitHub runner.
# Exists because the local machine's IP got Cloudflare-banned (error 1026)
# while crawling; runner IPs are clean. Safe to re-run: inserts dedupe on
# trade_id (ON CONFLICT DO NOTHING). Rows are tagged backfill-gap-20260819.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Run gap backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STATE_FILE: ./backfill-state-runner.json
        run: node backfill-gap.mjs
