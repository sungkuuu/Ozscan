name: pipeline-tick

# Overnight convergence loop for the CLV validation pipeline (2026-08-20/21).
# Every 6h: run clv-pilot (no-ops fast once all assets are priced), then let
# resolution-backfill soak the rest of the window. All scripts are resumable,
# so repeated ticks converge to done. DELETE THIS WORKFLOW once the pipeline
# has fully completed — it is a temporary scaffold, not a permanent job.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: CLV pilot (resumable)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node clv-pilot.mjs
      - name: Resolution backfill (resumable, soaks remaining window)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node resolution-backfill.mjs
