<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OZSCAN — Prediction Market Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fafafa;
      --bg-elevated: #fff;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --text-faint: #9ca3af;
      --accent: #10b981;
      --yes: #2563eb;
      --no: #dc2626;
      --chip-bg: #f3f4f6;
      --chip-active-bg: #111827;
      --chip-active-text: #fff;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --bg-elevated: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --text-muted: #d1d5db;
      --text-faint: #9ca3af;
      --accent: #34d399;
      --yes: #60a5fa;
      --no: #f87171;
      --chip-bg: #374151;
      --chip-active-bg: #f9fafb;
      --chip-active-text: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px 0;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.05em;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .right-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .theme-toggle {
      background: var(--chip-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .theme-toggle:hover { opacity: 0.9; }
    .tabs {
      display: flex;
      gap: 4px;
    }
    .tabs a {
      padding: 8px 14px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
    .tabs a:hover { color: var(--text); background: var(--chip-bg); }
    .tabs a.active { color: var(--text); background: var(--chip-bg); }
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      min-height: calc(100vh - 120px);
    }
    main {
      padding: 20px;
      overflow-y: auto;
    }
    aside {
      padding: 20px;
      border-left: 1px solid var(--border);
      background: var(--bg-elevated);
      overflow-y: auto;
    }
    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .feed-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      text-transform: uppercase;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chips button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--chip-bg);
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .chips button:hover { color: var(--text); border-color: var(--text-faint); }
    .chips button.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      border-color: var(--chip-active-bg);
    }
    .whale-list { list-style: none; padding: 0; margin: 0; }
    .whale-item {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px 16px;
      align-items: start;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .whale-item:last-child { border-bottom: 0; }
    .whale-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--chip-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .whale-body {}
    .whale-market {
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }
    .whale-meta {
      font-size: 11px;
      color: var(--text-muted);
    }
    .whale-side { font-weight: 600; }
    .whale-side.yes { color: var(--yes); }
    .whale-side.no { color: var(--no); }
    .whale-right { text-align: right; }
    .whale-amount { font-weight: 600; color: var(--text); }
    .whale-time { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin: 0 0 12px 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .stat-value { font-weight: 700; font-size: 16px; color: var(--text); }
    .stat-label { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
    .wallet-list { list-style: none; padding: 0; margin: 0; }
    .wallet-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .wallet-item:last-child { border-bottom: 0; }
    .wallet-addr { color: var(--text); word-break: break-all; }
    .wallet-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
    .empty-msg { color: var(--text-faint); font-size: 12px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="logo">
        <span class="dot"></span>
        OZSCAN
      </div>
      <div class="right-top">
        <span class="live-badge"><span class="dot"></span> LIVE</span>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">Dark</button>
      </div>
    </div>
    <nav class="tabs">
      <a href="#" class="active">Whale Feed</a>
      <a href="#">Smart Money</a>
    </nav>
  </header>

  <div class="layout">
    <main>
      <div class="feed-header">
        <span class="feed-label">Recent Whale Trades</span>
        <div class="chips">
          <button type="button" class="active" data-min="0">All</button>
          <button type="button" data-min="2000">$2K+</button>
          <button type="button" data-min="5000">$5K+</button>
          <button type="button" data-min="10000">$10K+</button>
        </div>
      </div>
      <ul class="whale-list" id="whale-list"></ul>
    </main>

    <aside>
      <h2 class="sidebar-title">Today's Stats</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-count">0</div>
          <div class="stat-label">Count</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-volume">$0</div>
          <div class="stat-label">Volume</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-avg">$0</div>
          <div class="stat-label">Avg</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-max">$0</div>
          <div class="stat-label">Max</div>
        </div>
      </div>
      <h2 class="sidebar-title">Top Wallets</h2>
      <ul class="wallet-list" id="wallet-list">
        <li class="wallet-item"><span class="empty-msg">No wallet data yet</span></li>
      </ul>
    </aside>
  </div>

  <script>
    const whaleList = document.getElementById('whale-list');
    const statCount = document.getElementById('stat-count');
    const statVolume = document.getElementById('stat-volume');
    const statAvg = document.getElementById('stat-avg');
    const statMax = document.getElementById('stat-max');
    const walletList = document.getElementById('wallet-list');
    const themeToggle = document.getElementById('theme-toggle');

    let minAmount = 0;
    let whales = [];

    const saved = localStorage.getItem('ozscan-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggle.textContent = 'Light';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('ozscan-theme', 'light');
        themeToggle.textContent = 'Dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('ozscan-theme', 'dark');
        themeToggle.textContent = 'Light';
      }
    });

    function formatAmount(n) {
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
      return '$' + Number(n).toLocaleString();
    }

    function timeAgo(ts) {
      const sec = typeof ts === 'number' ? ts : (/^\d+$/.test(String(ts)) ? parseInt(ts, 10) : new Date(ts).getTime() / 1000);
      const s = Math.floor((Date.now() / 1000 - sec));
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s == null ? '' : s;
      return div.innerHTML;
    }

    function filtered() {
      return whales.filter(w => (Number(w.size) || 0) >= minAmount);
    }

    function render() {
      const list = filtered();
      whaleList.innerHTML = list.length === 0
        ? '<li class="whale-item"><div class="whale-icon">🐋</div><div class="whale-body"><span class="empty-msg">No whale trades in this range.</span></div><div></div></li>'
        : list.map(w => {
            const size = Number(w.size) || 0;
            const side = (w.side || 'YES').toUpperCase();
            const market = (w.market || '').slice(0, 80) + ((w.market || '').length > 80 ? '…' : '');
            const ts = w.timestamp != null ? w.timestamp : (w.created_at ? new Date(w.created_at).getTime() / 1000 : null);
            const timeStr = ts != null ? timeAgo(ts) : '—';
            return `
              <li class="whale-item">
                <div class="whale-icon">🐋</div>
                <div class="whale-body">
                  <div class="whale-market">${escapeHtml(market)}</div>
                  <div class="whale-meta"><span class="whale-side ${side === 'YES' ? 'yes' : 'no'}">${side}</span> · Polymarket · ${timeStr}</div>
                </div>
                <div class="whale-right">
                  <div class="whale-amount">${formatAmount(size)}</div>
                </div>
              </li>`;
          }).join('');

      const total = whales.reduce((s, w) => s + (Number(w.size) || 0), 0);
      const sizes = whales.map(w => Number(w.size) || 0).filter(Boolean);
      const maxSize = sizes.length ? Math.max(...sizes) : 0;
      statCount.textContent = whales.length;
      statVolume.textContent = formatAmount(total);
      statAvg.textContent = whales.length ? formatAmount(total / whales.length) : '$0';
      statMax.textContent = formatAmount(maxSize);
    }

    async function fetchWhales() {
      try {
        const res = await fetch('/api/whales');
        whales = await res.json();
        if (!Array.isArray(whales)) whales = [];
        render();
      } catch (e) {
        whaleList.innerHTML = '<li class="whale-item"><div class="whale-icon">🐋</div><div class="whale-body"><span class="empty-msg">Failed to load.</span></div><div></div></li>';
      }
    }

    document.querySelectorAll('.chips button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chips button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        minAmount = Number(btn.dataset.min) || 0;
        render();
      });
    });

    fetchWhales();
    setInterval(fetchWhales, 30000);
  </script>
</body>
</html>
